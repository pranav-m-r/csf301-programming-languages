<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeteroList Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        
        .navbar {
            background: rgba(0, 0, 0, 0.3) !important;
            backdrop-filter: blur(10px);
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border: none;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-gradient:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
        
        .operation-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            transition: all 0.3s ease;
        }
        
        .operation-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: var(--gradient-start);
            color: #fff;
        }
        
        .operation-btn.active {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-color: transparent;
        }
        
        .list-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 1.1rem;
            min-height: 60px;
            word-break: break-all;
        }
        
        .type-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }
        
        .type-int { background-color: #3498db; }
        .type-double { background-color: #9b59b6; }
        .type-string { background-color: #27ae60; }
        .type-bool { background-color: #e74c3c; }
        .type-null { background-color: #7f8c8d; }
        
        .result-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border: 1px solid rgba(102, 126, 234, 0.3);
        }
        
        .stats-value {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .history-item:hover {
            background: rgba(102, 126, 234, 0.2);
        }
        
        .glow-text {
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .spinner-border {
            width: 1rem;
            height: 1rem;
        }
        
        #inputArea {
            font-family: 'Fira Code', 'Consolas', monospace;
        }
        
        .operation-category {
            border-left: 3px solid var(--gradient-start);
            padding-left: 15px;
            margin-bottom: 20px;
        }
        
        .frequency-bar {
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            height: 24px;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .quick-add-btn {
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="bi bi-list-ul me-2 fs-4"></i>
                <span class="fw-bold">HeteroList Explorer</span>
            </a>
            <span class="badge bg-secondary">
                <i class="bi bi-cpu me-1"></i>C++ Powered
            </span>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row">
            <!-- Left Column: Input & Operations -->
            <div class="col-lg-5 mb-4">
                <!-- Input Card -->
                <div class="card mb-4">
                    <div class="card-header border-0">
                        <h5 class="mb-0">
                            <i class="bi bi-input-cursor-text me-2"></i>List Input
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <textarea id="inputArea" class="form-control bg-dark text-light" rows="3" 
                                placeholder='Enter values: [1, 2.5, "hello", true, null]'>[1, 2, 3, "hello", "world", 3.14, true, false]</textarea>
                        </div>
                        <div class="d-flex flex-wrap gap-2 mb-3">
                            <span class="text-muted small">Quick add:</span>
                            <button class="btn btn-outline-primary quick-add-btn" onclick="quickAdd('int')">
                                <i class="bi bi-123"></i> Int
                            </button>
                            <button class="btn btn-outline-success quick-add-btn" onclick="quickAdd('string')">
                                <i class="bi bi-fonts"></i> String
                            </button>
                            <button class="btn btn-outline-info quick-add-btn" onclick="quickAdd('double')">
                                <i class="bi bi-percent"></i> Double
                            </button>
                            <button class="btn btn-outline-warning quick-add-btn" onclick="quickAdd('bool')">
                                <i class="bi bi-toggle-on"></i> Bool
                            </button>
                            <button class="btn btn-outline-secondary quick-add-btn" onclick="quickAdd('null')">
                                <i class="bi bi-x-circle"></i> Null
                            </button>
                        </div>
                        <div class="d-grid gap-2">
                            <button class="btn btn-gradient" onclick="createList()">
                                <i class="bi bi-play-fill me-2"></i>Create List
                            </button>
                            <div class="btn-group">
                                <button class="btn btn-outline-light" onclick="loadSample('numbers')">
                                    <i class="bi bi-hash"></i> Numbers
                                </button>
                                <button class="btn btn-outline-light" onclick="loadSample('mixed')">
                                    <i class="bi bi-shuffle"></i> Mixed
                                </button>
                                <button class="btn btn-outline-light" onclick="loadSample('strings')">
                                    <i class="bi bi-chat-quote"></i> Strings
                                </button>
                                <button class="btn btn-outline-light" onclick="clearList()">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Operations Card -->
                <div class="card">
                    <div class="card-header border-0">
                        <h5 class="mb-0">
                            <i class="bi bi-gear me-2"></i>Operations
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- Transform Operations -->
                        <div class="operation-category">
                            <h6 class="text-muted mb-3"><i class="bi bi-arrow-repeat me-2"></i>Transform</h6>
                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <button class="btn operation-btn" onclick="doSort('asc')">
                                    <i class="bi bi-sort-up"></i> Sort ↑
                                </button>
                                <button class="btn operation-btn" onclick="doSort('desc')">
                                    <i class="bi bi-sort-down"></i> Sort ↓
                                </button>
                                <button class="btn operation-btn" onclick="doReverse()">
                                    <i class="bi bi-arrow-left-right"></i> Reverse
                                </button>
                                <button class="btn operation-btn" onclick="doUnique()">
                                    <i class="bi bi-stars"></i> Unique
                                </button>
                            </div>
                        </div>

                        <!-- Map Operations -->
                        <div class="operation-category">
                            <h6 class="text-muted mb-3"><i class="bi bi-funnel me-2"></i>Map</h6>
                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <button class="btn operation-btn" onclick="doMap('double')">×2</button>
                                <button class="btn operation-btn" onclick="doMap('square')">x²</button>
                                <button class="btn operation-btn" onclick="doMap('negate')">±</button>
                                <button class="btn operation-btn" onclick="doMap('increment')">+1</button>
                                <button class="btn operation-btn" onclick="doMap('decrement')">-1</button>
                                <button class="btn operation-btn" onclick="doMap('uppercase')">ABC</button>
                                <button class="btn operation-btn" onclick="doMap('lowercase')">abc</button>
                            </div>
                        </div>

                        <!-- Filter Operations -->
                        <div class="operation-category">
                            <h6 class="text-muted mb-3"><i class="bi bi-filter me-2"></i>Filter</h6>
                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <button class="btn operation-btn" onclick="doFilter('int')">Integers</button>
                                <button class="btn operation-btn" onclick="doFilter('double')">Doubles</button>
                                <button class="btn operation-btn" onclick="doFilter('string')">Strings</button>
                                <button class="btn operation-btn" onclick="doFilter('bool')">Bools</button>
                                <button class="btn operation-btn" onclick="doFilter('numeric')">Numeric</button>
                                <button class="btn operation-btn" onclick="doFilter('even')">Even</button>
                                <button class="btn operation-btn" onclick="doFilter('odd')">Odd</button>
                                <button class="btn operation-btn" onclick="doFilter('positive')">+ve</button>
                                <button class="btn operation-btn" onclick="doFilter('negative')">-ve</button>
                            </div>
                        </div>

                        <!-- Reduce Operations -->
                        <div class="operation-category">
                            <h6 class="text-muted mb-3"><i class="bi bi-chevron-bar-contract me-2"></i>Reduce</h6>
                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <button class="btn operation-btn" onclick="doReduce('sum')">
                                    <i class="bi bi-plus-lg"></i> Sum
                                </button>
                                <button class="btn operation-btn" onclick="doReduce('product')">
                                    <i class="bi bi-x-lg"></i> Product
                                </button>
                                <button class="btn operation-btn" onclick="doReduce('concat')">
                                    <i class="bi bi-link"></i> Concat
                                </button>
                            </div>
                        </div>

                        <!-- Analysis Operations -->
                        <div class="operation-category">
                            <h6 class="text-muted mb-3"><i class="bi bi-graph-up me-2"></i>Analysis</h6>
                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <button class="btn operation-btn" onclick="doStats()">
                                    <i class="bi bi-calculator"></i> Stats
                                </button>
                                <button class="btn operation-btn" onclick="doCount()">
                                    <i class="bi bi-pie-chart"></i> Count Types
                                </button>
                                <button class="btn operation-btn" onclick="doFrequencies()">
                                    <i class="bi bi-bar-chart"></i> Frequencies
                                </button>
                                <button class="btn operation-btn" onclick="doInversions()">
                                    <i class="bi bi-shuffle"></i> Inversions
                                </button>
                            </div>
                        </div>

                        <!-- Slice Operations -->
                        <div class="operation-category">
                            <h6 class="text-muted mb-3"><i class="bi bi-scissors me-2"></i>Slice</h6>
                            <div class="input-group mb-3">
                                <input type="number" id="sliceN" class="form-control bg-dark text-light" value="3" min="1">
                                <button class="btn operation-btn" onclick="doTake()">Take</button>
                                <button class="btn operation-btn" onclick="doDrop()">Drop</button>
                            </div>
                        </div>

                        <!-- Partition -->
                        <div class="operation-category">
                            <h6 class="text-muted mb-3"><i class="bi bi-distribute-vertical me-2"></i>Partition</h6>
                            <div class="d-flex flex-wrap gap-2">
                                <button class="btn operation-btn" onclick="doPartition('numeric')">Numeric</button>
                                <button class="btn operation-btn" onclick="doPartition('int')">Int</button>
                                <button class="btn operation-btn" onclick="doPartition('string')">String</button>
                                <button class="btn operation-btn" onclick="doPartition('even')">Even/Odd</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Results -->
            <div class="col-lg-7">
                <!-- Current List Card -->
                <div class="card mb-4 result-card">
                    <div class="card-header border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="bi bi-collection me-2"></i>Current List
                        </h5>
                        <span id="listSize" class="badge bg-primary">0 elements</span>
                    </div>
                    <div class="card-body">
                        <div id="currentList" class="list-display">
                            <span class="text-muted">Create a list to begin...</span>
                        </div>
                        <div id="typeBreakdown" class="mt-3 d-flex flex-wrap gap-2">
                            <!-- Type badges will be inserted here -->
                        </div>
                    </div>
                </div>

                <!-- Result Card -->
                <div class="card mb-4">
                    <div class="card-header border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="bi bi-lightning me-2"></i>Result
                        </h5>
                        <button class="btn btn-sm btn-outline-light" onclick="applyResult()" id="applyBtn" style="display: none;">
                            <i class="bi bi-arrow-up-circle"></i> Apply to List
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="resultDisplay" class="list-display fade-in">
                            <span class="text-muted">Run an operation to see results...</span>
                        </div>
                        <div id="resultMeta" class="mt-3"></div>
                    </div>
                </div>

                <!-- Stats Card (Hidden by default) -->
                <div class="card mb-4" id="statsCard" style="display: none;">
                    <div class="card-header border-0">
                        <h5 class="mb-0">
                            <i class="bi bi-graph-up-arrow me-2"></i>Statistics
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center" id="statsDisplay">
                            <!-- Stats will be inserted here -->
                        </div>
                    </div>
                </div>

                <!-- Frequencies Card (Hidden by default) -->
                <div class="card mb-4" id="freqCard" style="display: none;">
                    <div class="card-header border-0">
                        <h5 class="mb-0">
                            <i class="bi bi-bar-chart-fill me-2"></i>Frequencies
                        </h5>
                    </div>
                    <div class="card-body" id="freqDisplay">
                        <!-- Frequencies will be inserted here -->
                    </div>
                </div>

                <!-- History Card -->
                <div class="card">
                    <div class="card-header border-0 d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="bi bi-clock-history me-2"></i>History
                        </h5>
                        <button class="btn btn-sm btn-outline-danger" onclick="clearHistory()">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                    <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                        <div id="historyList">
                            <span class="text-muted">Operations will appear here...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="position-fixed top-0 start-0 w-100 h-100 d-none" 
         style="background: rgba(0,0,0,0.5); z-index: 9999;">
        <div class="d-flex justify-content-center align-items-center h-100">
            <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentList = [];
        let lastResult = null;
        let history = [];

        // Sample data
        const samples = {
            numbers: [5, 3, 8, 1, 9, 2, 7, 4, 6, 10],
            mixed: [1, 2.5, "hello", true, 42, "world", 3.14, false, null, 100],
            strings: ["apple", "banana", "cherry", "date", "elderberry", "fig", "grape"]
        };

        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('d-none');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('d-none');
        }

        function formatList(list) {
            if (!list || list.length === 0) return '<span class="text-muted">Empty list</span>';
            return list.map(item => {
                if (item === null) return '<span class="badge type-null">null</span>';
                if (typeof item === 'boolean') return `<span class="badge type-bool">${item}</span>`;
                if (typeof item === 'number' && Number.isInteger(item)) return `<span class="badge type-int">${item}</span>`;
                if (typeof item === 'number') return `<span class="badge type-double">${item}</span>`;
                if (typeof item === 'string') return `<span class="badge type-string">"${item}"</span>`;
                return `<span class="badge bg-secondary">${JSON.stringify(item)}</span>`;
            }).join(' ');
        }

        function updateListDisplay() {
            document.getElementById('currentList').innerHTML = formatList(currentList);
            document.getElementById('listSize').textContent = `${currentList.length} elements`;
            
            // Update type breakdown
            let counts = { int: 0, double: 0, string: 0, bool: 0, null: 0 };
            currentList.forEach(item => {
                if (item === null) counts.null++;
                else if (typeof item === 'boolean') counts.bool++;
                else if (typeof item === 'number' && Number.isInteger(item)) counts.int++;
                else if (typeof item === 'number') counts.double++;
                else if (typeof item === 'string') counts.string++;
            });
            
            let breakdown = '';
            if (counts.int > 0) breakdown += `<span class="badge type-int type-badge">${counts.int} int</span> `;
            if (counts.double > 0) breakdown += `<span class="badge type-double type-badge">${counts.double} double</span> `;
            if (counts.string > 0) breakdown += `<span class="badge type-string type-badge">${counts.string} string</span> `;
            if (counts.bool > 0) breakdown += `<span class="badge type-bool type-badge">${counts.bool} bool</span> `;
            if (counts.null > 0) breakdown += `<span class="badge type-null type-badge">${counts.null} null</span> `;
            document.getElementById('typeBreakdown').innerHTML = breakdown;
        }

        function showResult(data, operation) {
            document.getElementById('statsCard').style.display = 'none';
            document.getElementById('freqCard').style.display = 'none';
            
            if (data.error) {
                document.getElementById('resultDisplay').innerHTML = 
                    `<span class="text-danger"><i class="bi bi-exclamation-triangle me-2"></i>${data.error}</span>`;
                document.getElementById('applyBtn').style.display = 'none';
                document.getElementById('resultMeta').innerHTML = '';
                return;
            }

            // Handle different result types
            if (data.result !== undefined) {
                if (Array.isArray(data.result)) {
                    lastResult = data.result;
                    document.getElementById('resultDisplay').innerHTML = formatList(data.result);
                    document.getElementById('applyBtn').style.display = 'inline-block';
                } else {
                    lastResult = null;
                    document.getElementById('resultDisplay').innerHTML = 
                        `<span class="stats-value">${data.result}</span>`;
                    document.getElementById('applyBtn').style.display = 'none';
                }
            }

            // Meta information
            let meta = '';
            if (data.original_size !== undefined) meta += `<span class="badge bg-secondary me-2">Original: ${data.original_size}</span>`;
            if (data.filtered_size !== undefined) meta += `<span class="badge bg-success me-2">Filtered: ${data.filtered_size}</span>`;
            if (data.unique_size !== undefined) meta += `<span class="badge bg-info me-2">Unique: ${data.unique_size}</span>`;
            if (data.size !== undefined && !data.original_size) meta += `<span class="badge bg-primary me-2">Size: ${data.size}</span>`;
            if (data.popped !== undefined) meta += `<span class="badge bg-warning me-2">Popped: ${JSON.stringify(data.popped)}</span>`;
            if (data.inversions !== undefined) meta += `<span class="badge bg-info me-2">Inversions: ${data.inversions}</span>`;
            document.getElementById('resultMeta').innerHTML = meta;

            // Handle stats
            if (data.sum !== undefined && data.average !== undefined) {
                document.getElementById('statsCard').style.display = 'block';
                document.getElementById('statsDisplay').innerHTML = `
                    <div class="col-6 col-md-3 mb-3">
                        <div class="stats-value">${data.sum.toFixed(2)}</div>
                        <div class="text-muted">Sum</div>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <div class="stats-value">${data.average.toFixed(2)}</div>
                        <div class="text-muted">Average</div>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <div class="stats-value">${data.min}</div>
                        <div class="text-muted">Min</div>
                    </div>
                    <div class="col-6 col-md-3 mb-3">
                        <div class="stats-value">${data.max}</div>
                        <div class="text-muted">Max</div>
                    </div>
                `;
                document.getElementById('resultDisplay').innerHTML = 
                    `<span class="text-muted">See statistics below ↓</span>`;
            }

            // Handle type count
            if (data.integers !== undefined) {
                document.getElementById('resultDisplay').innerHTML = `
                    <div class="row text-center">
                        <div class="col"><span class="badge type-int fs-5">${data.integers}</span><br><small>Int</small></div>
                        <div class="col"><span class="badge type-double fs-5">${data.doubles}</span><br><small>Double</small></div>
                        <div class="col"><span class="badge type-string fs-5">${data.strings}</span><br><small>String</small></div>
                        <div class="col"><span class="badge type-bool fs-5">${data.booleans}</span><br><small>Bool</small></div>
                        <div class="col"><span class="badge type-null fs-5">${data.nulls}</span><br><small>Null</small></div>
                    </div>
                `;
            }

            // Handle frequencies
            if (data.frequencies) {
                document.getElementById('freqCard').style.display = 'block';
                const maxCount = Math.max(...data.frequencies.map(f => f.count));
                let freqHtml = '';
                data.frequencies.forEach(f => {
                    const width = (f.count / maxCount * 100).toFixed(0);
                    freqHtml += `
                        <div class="mb-2">
                            <div class="d-flex justify-content-between mb-1">
                                <span>${JSON.stringify(f.value)}</span>
                                <span class="badge bg-primary">${f.count}</span>
                            </div>
                            <div class="frequency-bar" style="width: ${width}%"></div>
                        </div>
                    `;
                });
                document.getElementById('freqDisplay').innerHTML = freqHtml;
            }

            // Handle partition
            if (data.matching !== undefined) {
                lastResult = data.matching;
                document.getElementById('resultDisplay').innerHTML = `
                    <div class="mb-3">
                        <strong class="text-success">Matching:</strong><br>
                        ${formatList(data.matching)}
                    </div>
                    <div>
                        <strong class="text-danger">Non-matching:</strong><br>
                        ${formatList(data.non_matching)}
                    </div>
                `;
                document.getElementById('applyBtn').style.display = 'inline-block';
            }

            // Add to history
            addToHistory(operation, data);
        }

        function addToHistory(operation, data) {
            history.unshift({ operation, data, timestamp: new Date() });
            if (history.length > 20) history.pop();
            
            let historyHtml = '';
            history.forEach((item, idx) => {
                historyHtml += `
                    <div class="history-item" onclick="restoreHistory(${idx})">
                        <div class="d-flex justify-content-between">
                            <strong>${item.operation}</strong>
                            <small class="text-muted">${item.timestamp.toLocaleTimeString()}</small>
                        </div>
                    </div>
                `;
            });
            document.getElementById('historyList').innerHTML = historyHtml || '<span class="text-muted">No history yet</span>';
        }

        function restoreHistory(idx) {
            const item = history[idx];
            if (item.data.result && Array.isArray(item.data.result)) {
                currentList = item.data.result;
                updateListDisplay();
            }
        }

        function clearHistory() {
            history = [];
            document.getElementById('historyList').innerHTML = '<span class="text-muted">No history yet</span>';
        }

        async function apiCall(endpoint, body) {
            showLoading();
            try {
                const response = await fetch(`/api/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                return await response.json();
            } catch (error) {
                return { error: error.message };
            } finally {
                hideLoading();
            }
        }

        async function createList() {
            const input = document.getElementById('inputArea').value;
            const data = await apiCall('create', { list: input });
            if (data.result) {
                currentList = data.result;
                updateListDisplay();
            }
            showResult(data, 'Create List');
        }

        function applyResult() {
            if (lastResult && Array.isArray(lastResult)) {
                currentList = lastResult;
                updateListDisplay();
                document.getElementById('inputArea').value = JSON.stringify(currentList);
            }
        }

        function loadSample(type) {
            currentList = [...samples[type]];
            document.getElementById('inputArea').value = JSON.stringify(currentList);
            updateListDisplay();
            showResult({ result: currentList }, `Load Sample (${type})`);
        }

        function clearList() {
            currentList = [];
            document.getElementById('inputArea').value = '[]';
            updateListDisplay();
        }

        function quickAdd(type) {
            let value;
            switch (type) {
                case 'int': value = Math.floor(Math.random() * 100); break;
                case 'double': value = (Math.random() * 100).toFixed(2); value = parseFloat(value); break;
                case 'string': value = ['apple', 'banana', 'cherry', 'date', 'fig'][Math.floor(Math.random() * 5)]; break;
                case 'bool': value = Math.random() > 0.5; break;
                case 'null': value = null; break;
            }
            currentList.push(value);
            document.getElementById('inputArea').value = JSON.stringify(currentList);
            updateListDisplay();
        }

        async function doSort(order) {
            const data = await apiCall('sort', { list: JSON.stringify(currentList), order });
            showResult(data, `Sort (${order})`);
        }

        async function doFilter(type) {
            const data = await apiCall('filter', { list: JSON.stringify(currentList), type });
            showResult(data, `Filter (${type})`);
        }

        async function doMap(operation) {
            const data = await apiCall('map', { list: JSON.stringify(currentList), operation });
            showResult(data, `Map (${operation})`);
        }

        async function doReduce(operation) {
            const data = await apiCall('reduce', { list: JSON.stringify(currentList), operation });
            showResult(data, `Reduce (${operation})`);
        }

        async function doStats() {
            const data = await apiCall('stats', { list: JSON.stringify(currentList) });
            showResult(data, 'Statistics');
        }

        async function doUnique() {
            const data = await apiCall('unique', { list: JSON.stringify(currentList) });
            showResult(data, 'Unique');
        }

        async function doReverse() {
            const data = await apiCall('reverse', { list: JSON.stringify(currentList) });
            showResult(data, 'Reverse');
        }

        async function doTake() {
            const n = document.getElementById('sliceN').value;
            const data = await apiCall('take', { list: JSON.stringify(currentList), n: parseInt(n) });
            showResult(data, `Take (${n})`);
        }

        async function doDrop() {
            const n = document.getElementById('sliceN').value;
            const data = await apiCall('drop', { list: JSON.stringify(currentList), n: parseInt(n) });
            showResult(data, `Drop (${n})`);
        }

        async function doCount() {
            const data = await apiCall('count', { list: JSON.stringify(currentList) });
            showResult(data, 'Count Types');
        }

        async function doInversions() {
            const data = await apiCall('inversions', { list: JSON.stringify(currentList) });
            showResult(data, 'Count Inversions');
        }

        async function doFrequencies() {
            const data = await apiCall('frequencies', { list: JSON.stringify(currentList) });
            showResult(data, 'Frequencies');
        }

        async function doPartition(type) {
            const data = await apiCall('partition', { list: JSON.stringify(currentList), type });
            showResult(data, `Partition (${type})`);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSample('mixed');
        });
    </script>
</body>
</html>
